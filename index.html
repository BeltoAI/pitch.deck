function cmdOverview(){addMsg('<h2>SlyOS — Run LLMs Directly on Mobile</h2><div style="margin:6px 0"><span class="tag tag-rec">ZERO CLOUD COSTS</span><span class="tag tag-ok">ZERO LATENCY</span><span class="tag tag-blue">ABSOLUTE PRIVACY</span></div><p>SlyOS is middleware for on-device AI by <span class="hl">Belto Inc.</span> It intercepts application prompts at the SDK level and routes them to local silicon, utilizing the cloud only as a secondary fallback.</p><hr class="d"><p>Two components:</p><div class="card" style="border-color:rgba(255,77,0,.25)"><span class="card-t">&#9641; Edge SDK</span><div class="card-d">Drop-in library that intercepts API calls to run models directly on local hardware.</div><div class="cb" style="margin-top:6px;margin-bottom:0"><span class="fn">npm install</span> @belto/slyos-sdk</div></div><div class="card" style="border-color:rgba(255,77,0,.25)"><span class="card-t">&#9881; Dashboard</span><div class="card-d">Centralized hub for managing routing logic and model weight distribution.</div></div><hr class="d"><p class="dm" style="font-size:10px">Palo Alto / Stanford &nbsp;&#183;&nbsp; Pre-Seed &nbsp;&#183;&nbsp; <a href="https://belto.world" target="_blank">belto.world</a></p>');setSug(['cloud bottleneck','case: duolingo','the product','the ask','↩ menu'])}

function cmdProblem(){addMsg('<h2>The Cloud Bottleneck</h2><p>Standard app routing sends every interaction to expensive cloud APIs. High engagement becomes a financial liability — power users bleed your profit margins.</p><div class="ascii">  <span class="aw">STANDARD APP ROUTING</span>\n\n  +-----------+          +--------+          +------------------+\n  | <span class="aw">App</span>       |---<span class="ar">100%</span>-->| <span class="aw">User</span>   |---<span class="ar">100%</span>-->| <span class="ar">Cloud API</span>        |\n  | <span class="aa">Provider</span>  |          | <span class="aa">Alice</span>  |          | <span class="ar">AWS / GCP / OAPI</span> |\n  +-----------+          +--------+          +------------------+\n                                                     <span class="ar">^</span>\n                                         <span class="ar">CLOUD API BILLS ERODE MARGINS</span></div><hr class="d"><div class="mgrid"><div class="card" style="border-color:rgba(248,113,113,.2)"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">1</span><span class="card-t">Linear API Fees</span></div><div class="card-d">Cloud compute scales infinitely with usage. High engagement becomes a financial liability, bleeding profit margins on your best power users.</div></div><div class="card" style="border-color:rgba(248,113,113,.2)"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">2</span><span class="card-t">600ms+ Lag</span></div><div class="card-d">Network round-trips destroy the real-time immersion required for fluid voice and agentic workflows.</div></div><div class="card" style="border-color:rgba(248,113,113,.2)"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">3</span><span class="card-t">GDPR &amp; HIPAA Liability</span></div><div class="card-d">Sending user keystrokes to third-party servers blocks AI deployment in regulated sectors like health and fintech.</div></div><div class="card" style="border-color:rgba(248,113,113,.2)"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">4</span><span class="card-t">0.5L Water per 50 Prompts</span></div><div class="card-d">Hyperscale GPU cooling is an invisible, unsustainable ecological drain.</div></div></div>');setSug(['case: duolingo','case: anthropic','the product','↩ menu'])}

function cmdDuolingo(){addMsg('<h2>Case Study: <span style="color:var(--green)">Duolingo</span></h2><p class="dm">What happens when a 50M-DAU app tries to scale AI features on cloud APIs.</p><hr class="d"><div class="mgrid"><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">1</span><span class="card-t">$164M API Liability</span></div><div class="card-d">Generative AI costs drove a 120bps gross margin drop in Q3 2024. If just 10% of their 50M DAUs use AI features daily, cloud API fees hit <span style="color:#fff;font-weight:600">$164M/year</span> — compressing projected EBITDA from 28% down to 21%.</div></div><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">2</span><span class="card-t">5–50s Processing Lag</span></div><div class="card-d">Cloud round-trips for lesson generation take between 5 to 50 seconds, breaking the real-time immersion required for core premium features like "Video Call" and conversational "Roleplay".</div></div><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">3</span><span class="card-t">Voice Data Streaming</span></div><div class="card-d">Sustaining continuous conversational inference requires routing millions of users\' live voice recordings to third-party server infrastructure.</div></div><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">4</span><span class="card-t">15 Million Daily API Calls</span></div><div class="card-d">Processing just 3 interactions for 5M users generates massive, continuous hyperscale GPU cooling and power loads.</div></div></div>');setSug(['case: anthropic','the product','unit economics','↩ menu'])}

function cmdAnthropic(){addMsg('<h2>Case Study: <span style="color:var(--purple)">Anthropic</span></h2><p class="dm">Even model providers are bleeding from cloud compute costs.</p><hr class="d"><div class="mgrid"><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">1</span><span class="card-t">The Inference Burn</span></div><div class="card-d">Cloud compute is so unprofitable that Anthropic enforces <span style="color:#fff;font-weight:600">strict message limits</span> on $20/mo Claude Pro users. Their best users bleed their margins.</div></div><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">2</span><span class="card-t">Agentic Execution Lag</span></div><div class="card-d">Network round-trips bottleneck "Computer Use" agents. Autonomous AI requires millisecond local feedback loops, not multi-second server delays.</div></div><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">3</span><span class="card-t">Enterprise IP Leakage</span></div><div class="card-d">Fortune 500s refuse to send proprietary data to centralized clouds, entirely blocking massive B2B enterprise deals.</div></div><div class="card"><div style="display:flex;align-items:baseline;gap:8px"><span style="color:var(--red);font-size:20px;font-weight:700">4</span><span class="card-t">Gigawatt Data Centers</span></div><div class="card-d">Scaling cloud inference requires dedicated power grids, making the current infrastructure physically unsustainable.</div></div></div>');setSug(['the product','unit economics','cloud bottleneck','↩ menu'])}

ass="st"><span class="st-l">zero-lag ux</span> <span class="st-v" style="color:var(--green)">Sub-100ms response</span></span><span class="st"><span class="st-l">total privacy</span> <span class="st-v" style="color:var(--blue)">Data never leaves the user</span></span><span class="st"><span class="st-l">esg impact</span> <span class="st-v" style="color:var(--green)">Massive datacenter reduction</span></span></div>');setSug(['smart routing','under the hood','deploy in 60s','unit economics','↩ menu'])}

function cmdArchitecture(){addMsg('<h2>How It Works Under the Hood</h2><p class="dm">The SlyOS Ecosystem — three layers working together.</p><hr class="d"><div class="card" style="border-style:dashed"><span class="card-m">THE CLOUD DASHBOARD</span><div class="mgrid" style="margin-top:6px"><div><span class="card-t">Enterprise Data Sync</span><div class="card-d">Your company documents are securely indexed in the cloud. <span style="color:#fff;font-weight:600">We never store user queries.</span></div></div><div><span class="card-t">Global Fleet Analytics</span><div class="card-d">Monitor cost-savings, user latency, and phone compatibility across your entire user base.</div></div></div></div><p style="text-align:center;color:var(--dim);font-size:14px;margin:4px 0">&#8595;&#8593;</p><div class="card" style="border-color:rgba(255,77,0,.3);background:rgba(255,77,0,.03)"><span class="card-m" style="color:var(--accent)">THE SLYOS ENGINE</span><div class="mgrid" style="margin-top:6px"><div><span class="card-t">Write Once, Run Anywhere</span><div class="card-d">We compress the AI into a single file that automatically works on <span style="color:#fff;font-weight:600">iOS, Android, and Web browsers.</span></div></div><div><span class="card-t">The Traffic Cop</span><div class="card-d">Instantly decides whether to generate text on the phone for free, or send it to the cloud.</div></div></div></div><p style="text-align:center;color:var(--dim);font-size:14px;margin:4px 0">&#8595;&#8593;</p><div class="card"><span class="card-m">THE USER\'S PHONE</span><div class="mgrid" style="margin-top:6px"><div><span class="card-t">Device Health Check</span><div class="card-d">Constantly checks the phone\'s battery life, available memory, and temperature before running AI.</div></div><div><span class="card-t">Native Integration</span><div class="card-d">Plugs directly into Apple and Google\'s built-in systems so you don\'t have to code it yourself.</div></div></div></div>');setSug(['smart routing','deploy in 60s','trade-offs','↩ menu'])}

function cmdTradeoffs(){addMsg('<h2>Engineering Trade-Offs</h2><p class="dm">How we optimize for mobile — every slider is adjustable via SlyOS Web Dashboard.</p><hr class="d"><div class="mgrid"><div class="card"><span class="card-m">PERFECT ACCURACY &#8592;&#8594; LIGHTNING SPEED</span><div class="card-t" style="margin-top:4px">Massive Speed, ~1% Quality Drop</div><div class="card-d">We shrink the AI model so it generates words instantly on a phone, with a barely noticeable drop in text quality.</div><div class="bar-wrap" style="margin-top:6px"><div class="bar" style="height:4px"><div class="bar-fill" data-w="85%" style="background:var(--fg)"></div></div></div></div><div class="card" style="border-color:rgba(96,165,250,.2)"><span class="card-m">ABSOLUTE PRIVACY &#8592;&#8594; CLOUD BRAIN</span><div class="card-t" style="margin-top:4px;color:var(--blue)">Zero Data Leakage</div><div class="card-d">SlyOS searches your company\'s documents safely in the cloud, but the actual AI response is generated privately on the user\'s phone.</div><div class="bar-wrap" style="margin-top:6px"><div class="bar" style="height:4px"><div class="bar-fill" data-w="35%" style="background:var(--blue)"></div></div></div></div><div class="card"><span class="card-m">HUGE AI MODELS &#8592;&#8594; TINY APP SIZE</span><div class="card-t" style="margin-top:4px">Under 1 GB Download Size</div><div class="card-d">Instead of forcing users to download 40GB models, we compress them to a fraction of the size and automatically delete unused models to save phone storage.</div><div class="bar-wrap" style="margin-top:6px"><div class="bar" style="height:4px"><div class="bar-fill" data-w="80%" style="background:var(--fg)"></div></div></div></div><div class="card" style="border-color:rgba(96,165,250,.2)"><span class="card-m">BATTERY LIFE &#8592;&#8594; ENDLESS AI CHAT</span><div class="card-t" style="margin-top:4px;color:var(--blue)">&lt; 1.5% Daily Battery Impact</div><div class="card-d">AI drains batteries if function cmdHotswap(){addMsg('<h2>Handling Different Models — Hot-Swap</h2><p class="dm">When multiple apps on one phone each use different AI models, SlyOS manages the chaos.</p><hr class="d"><div class="mgrid"><div class="card"><span class="tag tag-soon">APP 1: FINANCE</span><div class="card-t" style="margin-top:4px">Uses Model A (Llama-3)</div><div class="card-d">The user is checking their portfolio. SlyOS loads the <span style="color:#fff;font-weight:600">Llama-3</span> model into the phone\'s chip. Performance is 100%.</div></div><div class="card"><span class="tag tag-soon">APP 2: TRAVEL</span><div class="card-t" style="margin-top:4px">Uses Model B (Phi-3)</div><div class="card-d">The user switches to book a flight. <span style="color:#fff;font-weight:600">Phi-3</span> is a different model. Without SlyOS, the phone would freeze trying to run both.</div></div></div><hr class="d"><h3>The SlyOS Switch</h3><div class="mgrid"><div class="card" style="border-color:rgba(96,165,250,.2);background:rgba(96,165,250,.03)"><span class="tag tag-blue">INSTANT HOT-SWAP</span><div class="card-d" style="margin-top:4px">As the user switches apps, SlyOS <span style="color:#fff;font-weight:600">instantly pauses</span> Model A and clears the memory for the next task. <span style="color:#fff;font-weight:600">Zero crashes.</span></div></div><div class="card" style="border-color:rgba(96,165,250,.2);background:rgba(96,165,250,.03)"><span class="tag tag-blue">MODEL MANAGEMENT</span><div class="card-d" style="margin-top:4px">SlyOS manages the <span style="color:#fff;font-weight:600">Model Registry</span>. It treats AI models like apps on a home screen — only the one you are using gets full power.</div></div></div><p class="dm" style="font-size:10px;margin-top:6px">Companies can select exactly which model they want from our library; SlyOS handles hardware compatibility automatically.</p>');setSug(['the product','trade-offs','landscape','↩ menu'])}
